name: AuraLunis Branch Audit

on:
  push:
    branches:
      - visual/sacred-sky-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auralunis-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run typecheck

      # Single source of truth. This includes static/whole-app QA, native-device
      # preflight, the physical-device regression guard, every premium/free gate,
      # astronomy checks, accessibility, reduced motion, RevenueCat and release config.
      - name: Complete feature and regression suite
        run: npm run qa:all

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auralunis-qa-report
          path: qa/FRESH_BUG_CHECK_RESULTS.json
          if-no-files-found: warn
